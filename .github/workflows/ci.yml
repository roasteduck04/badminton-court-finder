name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "ruff>=0.6"

      - name: "Ruff (blocking): syntax errors and undefined names"
        run: ruff check --select E9,F63,F7,F82 --output-format github .

      - name: "Ruff (non-blocking): full rule set"
        continue-on-error: true
        run: ruff check --output-format github .

      - name: Pytest
        # test_blender_smoke.py is skipped automatically (no bpy) via tests/conftest.py.
        run: python -m pytest -q -m "not slow"
