<title>Court Detection Review</title>
<style>
@font-face {
  font-family: 'JetBrains';
  src: local('JetBrains Mono'), local('Menlo'), local('Consolas');
}

:root {
  --bg: #0e1117;
  --surface: #161b22;
  --border: #2a3140;
  --text: #e2e8f0;
  --text-muted: #8b97a8;
  --accent: #3b82f6;
  --accent-dim: #1e3a5f;
  --good: #22c55e;
  --warn: #eab308;
  --bad: #ef4444;
  --kp-fill: #f472b6;
  --kp-stroke: #fff;
  --bbox: #3b82f6;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains', 'JetBrains Mono', Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --border: #d1d9e0;
    --text: #1a2332;
    --text-muted: #5a6778;
    --accent: #2563eb;
    --accent-dim: #dbeafe;
    --bbox: #2563eb;
  }
}
:root[data-theme="light"] {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --border: #d1d9e0;
  --text: #1a2332;
  --text-muted: #5a6778;
  --accent: #2563eb;
  --accent-dim: #dbeafe;
  --bbox: #2563eb;
}
:root[data-theme="dark"] {
  --bg: #0e1117;
  --surface: #161b22;
  --border: #2a3140;
  --text: #e2e8f0;
  --text-muted: #8b97a8;
  --accent: #3b82f6;
  --accent-dim: #1e3a5f;
  --bbox: #3b82f6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
}

.header {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.header .stats {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex;
  gap: 20px;
  font-variant-numeric: tabular-nums;
}
.header .stat-val { color: var(--accent); }

.controls {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.controls label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.controls select, .controls input[type="range"] {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
}
.controls input[type="range"] { width: 120px; accent-color: var(--accent); }
.toggle-group { display: flex; gap: 2px; }
.toggle-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 12px;
  font-size: 0.75rem;
  cursor: pointer;
  font-family: var(--font-mono);
}
.toggle-btn:first-child { border-radius: 4px 0 0 4px; }
.toggle-btn:last-child { border-radius: 0 4px 4px 0; }
.toggle-btn.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: var(--accent);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 1px;
  background: var(--border);
  margin-top: 1px;
}

.card {
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
.card.no-detection { opacity: 0.55; }
.card-img-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000;
}
.card-img-wrap img {
  width: 100%;
  display: block;
  object-fit: contain;
  max-height: 400px;
}
.card-img-wrap canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.card-info {
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
}
.card-name {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.card-badges { display: flex; gap: 6px; flex-shrink: 0; }
.badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.badge-conf {
  background: var(--accent-dim);
  color: var(--accent);
}
.badge-kp {
  background: color-mix(in srgb, var(--kp-fill) 20%, transparent);
  color: var(--kp-fill);
}
.badge-none {
  background: color-mix(in srgb, var(--bad) 15%, transparent);
  color: var(--bad);
}

.nav-strip {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  z-index: 10;
}

@media (max-width: 520px) {
  .gallery { grid-template-columns: 1fr; }
  .header, .controls { padding: 16px; }
}
</style>

<div class="header">
  <h1>Court Keypoint Detection Review</h1>
  <div class="stats">

<div class="controls">

</div>

<div class="gallery" id="gallery"></div>

const KP_NAMES = ['top-right','bottom-right','bottom-left','top-left'];
const KP_COLORS = ['#f472b6','#a78bfa','#34d399','#fbbf24'];

let currentFilter = 'all';
let overlayAlpha = 1;

function getTopPred(d) {
  if (!d.preds.length) return null;
  return d.preds.reduce((a,b) => a.conf > b.conf ? a : b);
}

function updateStats() {
  const detected = DATA.filter(d => d.preds.length > 0);
  const missed = DATA.filter(d => d.preds.length === 0);
  document.getElementById('detectedCount').textContent = detected.length;
  document.getElementById('missedCount').textContent = missed.length;
  const confs = detected.map(d => getTopPred(d).conf);
  const avg = confs.length ? confs.reduce((a,b)=>a+b,0)/confs.length : 0;
  document.getElementById('avgConf').textContent = (avg*100).toFixed(0) + '%';
}

function drawOverlay(canvas, item) {
  const img = canvas.previousElementSibling;
  const rect = img.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.globalAlpha = overlayAlpha;

  const sx = rect.width / item.w;
  const sy = rect.height / item.h;

  for (const p of item.preds) {
    const bx = (p.x - p.w/2) * sx;
    const by = (p.y - p.h/2) * sy;
    const bw = p.w * sx;
    const bh = p.h * sy;

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bbox').trim();
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 3]);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.setLineDash([]);

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bbox').trim();
    ctx.globalAlpha = overlayAlpha * 0.7;
    ctx.font = `bold ${Math.max(10, 12)}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim()}`;
    const label = `court ${(p.conf*100).toFixed(0)}%`;
    const tm = ctx.measureText(label);
    ctx.fillRect(bx, by - 18, tm.width + 8, 18);
    ctx.globalAlpha = overlayAlpha;
    ctx.fillStyle = '#fff';
    ctx.fillText(label, bx + 4, by - 5);

    for (const kp of p.kps) {
      const kx = kp.x * sx;
      const ky = kp.y * sy;
      const color = KP_COLORS[kp.id] || '#f472b6';

      ctx.beginPath();
      ctx.arc(kx, ky, 6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = `bold 10px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim()}`;
      const name = KP_NAMES[kp.id] || `pt-${kp.id}`;
      ctx.fillText(`${name} ${(kp.c*100).toFixed(0)}%`, kx + 10, ky + 4);
    }
  }

  // draw lines between keypoints if we have enough
  for (const p of item.preds) {
    if (p.kps.length >= 2) {
      const sorted = [...p.kps].sort((a,b) => a.id - b.id);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      for (let i = 0; i < sorted.length; i++) {
        const kx = sorted[i].x * sx;
        const ky = sorted[i].y * sy;
        if (i === 0) ctx.moveTo(kx, ky);
        else ctx.lineTo(kx, ky);
      }
      if (sorted.length > 2) ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function getSorted() {
  let items = [...DATA];
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'conf-desc') items.sort((a,b) => {
    const ca = getTopPred(a)?.conf ?? -1;
    const cb = getTopPred(b)?.conf ?? -1;
    return cb - ca;
  });
  else if (sort === 'conf-asc') items.sort((a,b) => {
    const ca = getTopPred(a)?.conf ?? -1;
    const cb = getTopPred(b)?.conf ?? -1;
    return ca - cb;
  });
  else if (sort === 'kp-desc') items.sort((a,b) => {
    const ka = a.preds.reduce((s,p) => s + p.kps.length, 0);
    const kb = b.preds.reduce((s,p) => s + p.kps.length, 0);
    return kb - ka;
  });
  else items.sort((a,b) => a.name.localeCompare(b.name));
  return items;
}

function render() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  const items = getSorted().filter(d => {
    if (currentFilter === 'detected') return d.preds.length > 0;
    if (currentFilter === 'missed') return d.preds.length === 0;
    return true;
  });

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card' + (item.preds.length === 0 ? ' no-detection' : '');
    const topPred = getTopPred(item);
    const totalKps = item.preds.reduce((s,p) => s + p.kps.length, 0);

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${item.url}" loading="lazy" crossorigin="anonymous">
        <canvas></canvas>
      </div>
      <div class="card-info">
        <span class="card-name">${item.name}</span>
        <div class="card-badges">
          ${topPred ? `<span class="badge badge-conf">${(topPred.conf*100).toFixed(0)}%</span>` : ''}
          ${totalKps > 0 ? `<span class="badge badge-kp">${totalKps} kp</span>` : ''}
          ${!topPred ? `<span class="badge badge-none">no detect</span>` : ''}
        </div>
      </div>
    `;
    gallery.appendChild(card);

    const img = card.querySelector('img');
    const canvas = card.querySelector('canvas');
    img.onload = () => drawOverlay(canvas, item);
  }
}

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('overlayOpacity').addEventListener('input', e => {
  overlayAlpha = e.target.value / 100;
  document.querySelectorAll('.card').forEach(card => {
    const canvas = card.querySelector('canvas');
    const img = card.querySelector('img');
    const idx = [...document.querySelectorAll('.card')].indexOf(card);
    const items = getSorted().filter(d => {
      if (currentFilter === 'detected') return d.preds.length > 0;
      if (currentFilter === 'missed') return d.preds.length === 0;
      return true;
    });
    if (items[idx]) drawOverlay(canvas, items[idx]);
  });
});

updateStats();
render();
</script>
