<title>Court Keypoint Review</title>
<style>
:root {
  --bg: #111318;
  --surface: #1a1d24;
  --border: #2c313a;
  --text: #d4dae4;
  --text-dim: #6b7280;
  --blue: #5b8def;
  --pink: #e879a0;
  --green: #4ade80;
  --amber: #f59e0b;
  --red: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); }

.top-bar {
  display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.top-bar h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
.stats { font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim); display: flex; gap: 14px; }
.stats b { color: var(--blue); }

.toolbar {
  display: flex; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border);
  align-items: center; flex-wrap: wrap; font-size: 0.75rem;
}
.toolbar label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.65rem; }
.pill-group { display: flex; }
.pill {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
  padding: 3px 10px; font-size: 0.7rem; cursor: pointer; font-family: var(--mono);
}
.pill:first-child { border-radius: 4px 0 0 4px; }
.pill:last-child { border-radius: 0 4px 4px 0; }
.pill.on { background: #1e3a5f; color: var(--blue); border-color: var(--blue); }
select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 3px 8px; border-radius: 4px; font-family: var(--mono); font-size: 0.7rem;
}
input[type=range] { width: 100px; accent-color: var(--blue); }
.kp-thresh-val { font-family: var(--mono); font-size: 0.7rem; color: var(--blue); min-width: 28px; }

.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1px; background: var(--border);
}
.card { background: var(--surface); }
.card.miss { opacity: 0.45; }
.img-wrap { position: relative; background: #000; line-height: 0; }
.img-wrap img { width: 100%; display: block; object-fit: contain; max-height: 360px; }
.img-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card-footer {
  padding: 8px 12px; display: flex; justify-content: space-between;
  align-items: center; border-top: 1px solid var(--border); gap: 6px;
}
.card-name { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badges { display: flex; gap: 5px; flex-shrink: 0; }
.badge {
  font-family: var(--mono); font-size: 0.6rem; padding: 1px 6px; border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
.badge-b { background: #1e3a5f; color: var(--blue); }
.badge-k { background: #3b1f3a; color: var(--pink); }
.badge-x { background: #3b1515; color: var(--red); }

.loading { padding: 60px; text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: 0.85rem; }

@media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
</style>

<div class="top-bar">
  <h1>Court Keypoint Review</h1>
  <div class="stats">
    <span><b id="sTotal">-</b> images</span>
    <span><b id="sDet">-</b> detected</span>
    <span><b id="sMiss">-</b> missed</span>
    <span>avg <b id="sConf">-</b></span>
  </div>
</div>

<div class="toolbar">
  <label>Show</label>
  <div class="pill-group">
    <button class="pill on" data-f="all">All</button>
    <button class="pill" data-f="det">Detected</button>
    <button class="pill" data-f="miss">Missed</button>
  </div>
  <label>Sort</label>
  <select id="sort">
    <option value="conf">Confidence</option>
    <option value="kp">Keypoints</option>
    <option value="name">Name</option>
  </select>
  <label>KP threshold</label>
  <input type="range" id="kpThresh" min="0" max="100" value="30">
  <span class="kp-thresh-val" id="kpThreshVal">0.30</span>
  <label>Overlay</label>
  <input type="range" id="overlay" min="0" max="100" value="100">
</div>

<div class="grid" id="grid">
  <div class="loading">Loading results from /api/results ...</div>
</div>

<script>
let DATA = [];
let filter = 'all';
let overlayA = 1;
let kpThreshold = 0.3;

const KP_COLORS = [
  '#e879a0','#a78bfa','#4ade80','#fbbf24','#60a5fa','#f472b6',
  '#34d399','#fb923c','#818cf8','#f87171','#2dd4bf','#a3e635',
  '#c084fc','#fca5a5','#67e8f9','#fdba74','#86efac','#d8b4fe',
  '#fcd34d','#93c5fd','#f9a8d4','#6ee7b7','#fde68a','#a5b4fc',
  '#bef264','#fda4af','#99f6e4','#fed7aa','#c4b5fd','#fecaca'
];

async function loadData() {
  try {
    const resp = await fetch('/api/results');
    if (!resp.ok) throw new Error(await resp.text());
    const json = await resp.json();
    DATA = json.results || [];
    updateStats();
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="loading">Failed to load results.<br>Run: python src/tools/run_inference.py<br>Then restart this server.</div>`;
  }
}

function topPred(d) {
  if (!d.predictions.length) return null;
  return d.predictions.reduce((a,b) => a.confidence > b.confidence ? a : b);
}

function countKps(d) {
  return d.predictions.reduce((s,p) =>
    s + (p.keypoints||[]).filter(k => k.confidence >= kpThreshold).length, 0);
}

function updateStats() {
  const det = DATA.filter(d => d.predictions.length > 0);
  document.getElementById('sTotal').textContent = DATA.length;
  document.getElementById('sDet').textContent = det.length;
  document.getElementById('sMiss').textContent = DATA.length - det.length;
  const confs = det.map(d => topPred(d).confidence);
  const avg = confs.length ? confs.reduce((a,b)=>a+b)/confs.length : 0;
  document.getElementById('sConf').textContent = (avg*100).toFixed(0)+'%';
}

function sorted() {
  let items = [...DATA];
  const s = document.getElementById('sort').value;
  if (s === 'conf') items.sort((a,b) => (topPred(b)?.confidence??-1) - (topPred(a)?.confidence??-1));
  else if (s === 'kp') items.sort((a,b) => countKps(b) - countKps(a));
  else items.sort((a,b) => a.filename.localeCompare(b.filename));
  return items;
}

function drawOverlay(canvas, item) {
  const img = canvas.previousElementSibling;
  if (!img.naturalWidth) return;
  const r = img.getBoundingClientRect();
  const dpr = devicePixelRatio;
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.globalAlpha = overlayA;

  const iw = item.image.width || img.naturalWidth;
  const ih = item.image.height || img.naturalHeight;

  const imgAspect = iw / ih;
  const boxAspect = r.width / r.height;
  let drawW, drawH, offsetX, offsetY;
  if (imgAspect > boxAspect) {
    drawW = r.width; drawH = r.width / imgAspect;
    offsetX = 0; offsetY = (r.height - drawH) / 2;
  } else {
    drawH = r.height; drawW = r.height * imgAspect;
    offsetX = (r.width - drawW) / 2; offsetY = 0;
  }
  const sx = drawW / iw;
  const sy = drawH / ih;

  for (const p of item.predictions) {
    const bx = offsetX + (p.x - p.width/2) * sx;
    const by = offsetY + (p.y - p.height/2) * sy;
    const bw = p.width * sx;
    const bh = p.height * sy;

    ctx.strokeStyle = '#5b8def';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 3]);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.setLineDash([]);

    ctx.font = 'bold 10px monospace';
    const lbl = `court ${(p.confidence*100).toFixed(0)}%`;
    const tw = ctx.measureText(lbl).width;
    ctx.globalAlpha = overlayA * 0.75;
    ctx.fillStyle = '#5b8def';
    ctx.fillRect(bx, by - 15, tw + 6, 15);
    ctx.globalAlpha = overlayA;
    ctx.fillStyle = '#fff';
    ctx.fillText(lbl, bx + 3, by - 4);

    const kps = (p.keypoints || []).filter(k => k.confidence >= kpThreshold);
    for (const kp of kps) {
      const kx = offsetX + kp.x * sx;
      const ky = offsetY + kp.y * sy;
      if (kx < offsetX - 5 || kx > offsetX + drawW + 5 || ky < offsetY - 5 || ky > offsetY + drawH + 5) continue;
      const col = KP_COLORS[kp.class_id % KP_COLORS.length];
      ctx.beginPath();
      ctx.arc(kx, ky, 5, 0, Math.PI*2);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '9px monospace';
      ctx.fillText(`${kp.class_id} ${(kp.confidence*100).toFixed(0)}%`, kx+8, ky+3);
    }

    if (kps.length >= 2) {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3,3]);
      ctx.beginPath();
      const s = [...kps].sort((a,b) => a.class_id - b.class_id);
      for (let i = 0; i < s.length; i++) {
        const kx = offsetX + s[i].x * sx;
        const ky = offsetY + s[i].y * sy;
        i === 0 ? ctx.moveTo(kx, ky) : ctx.lineTo(kx, ky);
      }
      if (s.length > 2) ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const items = sorted().filter(d => {
    if (filter === 'det') return d.predictions.length > 0;
    if (filter === 'miss') return d.predictions.length === 0;
    return true;
  });

  for (const item of items) {
    const card = document.createElement('div');
    const hasPred = item.predictions.length > 0;
    const tp = topPred(item);
    const nkp = countKps(item);
    card.className = 'card' + (hasPred ? '' : ' miss');
    card.innerHTML = `
      <div class="img-wrap">
        <img src="/images/${encodeURIComponent(item.filename)}" loading="lazy">
        <canvas></canvas>
      </div>
      <div class="card-footer">
        <span class="card-name">${item.filename}</span>
        <div class="badges">
          ${tp ? `<span class="badge badge-b">${(tp.confidence*100).toFixed(0)}%</span>` : ''}
          ${nkp ? `<span class="badge badge-k">${nkp} kp</span>` : ''}
          ${!hasPred ? `<span class="badge badge-x">miss</span>` : ''}
        </div>
      </div>`;
    grid.appendChild(card);

    const img = card.querySelector('img');
    const cvs = card.querySelector('canvas');
    img.onload = () => drawOverlay(cvs, item);
  }
}

document.querySelectorAll('.pill').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
    b.classList.add('on');
    filter = b.dataset.f;
    render();
  };
});
document.getElementById('sort').onchange = render;
document.getElementById('overlay').oninput = e => { overlayA = e.target.value/100; render(); };
document.getElementById('kpThresh').oninput = e => {
  kpThreshold = e.target.value/100;
  document.getElementById('kpThreshVal').textContent = kpThreshold.toFixed(2);
  render();
};

loadData();
</script>
